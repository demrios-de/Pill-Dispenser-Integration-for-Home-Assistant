blueprint:
  name: Pill Dispenser - Medikamenten-Tracking
  description: >
    Tracke ob ein Medikament genommen wurde mit automatischem Reset,
    Erinnerungen und Statistiken.
    
    Benötigt: 
    - Input Boolean (Helper: Schalter)
    - Input Text (Helper: Text) - Optional
    - Counter (Helper: Zähler) - Optional
  domain: automation
  input:
    # Erforderlich
    dispensed_sensor:
      name: Tray "Dispensed" Sensor
      description: Der Sensor der anzeigt ob das Medikament ausgegeben wurde
      selector:
        entity:
          filter:
            - integration: pill_dispenser
              domain: sensor
    
    taken_today_toggle:
      name: "Heute genommen" Helper
      description: Input Boolean der trackt ob heute genommen wurde
      selector:
        entity:
          filter:
            - domain: input_boolean
    
    # Optional
    medication_name:
      name: Medikamenten-Name (Optional)
      description: Input Text Helper mit dem Namen des Medikaments
      default: {}
      selector:
        entity:
          filter:
            - domain: input_text
    
    counter_entity:
      name: Zähler (Optional)
      description: Counter Helper für Statistiken
      default: {}
      selector:
        entity:
          filter:
            - domain: counter
    
    notify_device:
      name: Benachrichtigungs-Gerät (Optional)
      description: Gerät für Push-Benachrichtigungen
      default: {}
      selector:
        device:
          filter:
            - integration: mobile_app
    
    custom_message:
      name: Benutzerdefinierte Nachricht (Optional)
      description: Nachricht bei Einnahme (leer = Standard)
      default: ""
      selector:
        text:
          multiline: true

mode: queued
max_exceeded: silent

trigger:
  # Wenn Medikament ausgegeben wurde
  - platform: state
    entity_id: !input dispensed_sensor
    to: "Yes"

condition:
  # Nur wenn heute noch nicht als genommen markiert
  - condition: state
    entity_id: !input taken_today_toggle
    state: "off"

action:
  # 1. Markiere als genommen
  - service: input_boolean.turn_on
    target:
      entity_id: !input taken_today_toggle
  
  # 2. Erhöhe Counter (falls vorhanden)
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ counter_entity != {} }}"
        sequence:
          - service: counter.increment
            target:
              entity_id: !input counter_entity
  
  # 3. Sende Benachrichtigung (falls aktiviert)
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ notify_device != {} }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "✅ Medikament genommen"
            message: >
              {% set med_name = medication_name %}
              {% set custom_msg = custom_message %}
              
              {% if custom_msg != "" %}
                {{ custom_msg }}
              {% elif med_name != {} %}
                {{ states(med_name) }} wurde um {{ now().strftime('%H:%M') }} Uhr eingenommen.
              {% else %}
                Medikament wurde um {{ now().strftime('%H:%M') }} Uhr eingenommen.
              {% endif %}
