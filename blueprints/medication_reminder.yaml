blueprint:
  name: Pill Dispenser - Erinnerung bei vergessenen Medikamenten
  description: >
    Sendet eine Erinnerung wenn ein Medikament noch nicht genommen wurde.
    Prüft zu einer bestimmten Zeit ob der "Heute genommen" Schalter noch aus ist.
  domain: automation
  input:
    reminder_time:
      name: Erinnerungs-Zeit
      description: Wann soll geprüft werden?
      selector:
        time: {}
    
    taken_today_toggle:
      name: "Heute genommen" Helper
      description: Input Boolean der trackt ob heute genommen wurde
      selector:
        entity:
          filter:
            - domain: input_boolean
    
    medication_name:
      name: Medikamenten-Name (Optional)
      description: Input Text Helper mit dem Namen des Medikaments
      default: {}
      selector:
        entity:
          filter:
            - domain: input_text
    
    notify_device:
      name: Benachrichtigungs-Gerät
      description: Gerät für Push-Benachrichtigungen
      selector:
        device:
          filter:
            - integration: mobile_app
    
    reminder_message:
      name: Erinnerungs-Nachricht (Optional)
      description: Benutzerdefinierte Nachricht (leer = Standard)
      default: ""
      selector:
        text:
          multiline: true

mode: single

trigger:
  - platform: time
    at: !input reminder_time

condition:
  # Nur wenn noch nicht genommen
  - condition: state
    entity_id: !input taken_today_toggle
    state: "off"

action:
  - device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: "⚠️ Medikament vergessen?"
    message: >
      {% set med_name = medication_name %}
      {% set custom_msg = reminder_message %}
      
      {% if custom_msg != "" %}
        {{ custom_msg }}
      {% elif med_name != {} %}
        Du hast {{ states(med_name) }} noch nicht genommen!
      {% else %}
        Du hast dein Medikament noch nicht genommen!
      {% endif %}
